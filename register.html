<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="LDSP applicant registration page" />
        <meta name="author" content="LGU Daet" />
        <title>LDSP | Applicant Registration</title>
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/ldss.css" rel="stylesheet" />
        <link rel="icon" type="image/png" href="img/icon.png" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.28.0/feather.min.js" crossorigin="anonymous"></script>
    </head>
    <body class="ldss-auth">
        <div class="ldss-auth-wrap">
            <div class="card ldss-auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img class="ldss-auth-logo mb-2" src="img/daet-lgu.png" alt="LGU Daet Logo" />
                        <h1 class="h4 ldss-auth-title">Applicant Registration</h1>
                        <p class="ldss-auth-subtitle mb-0">Create your LDSP account</p>
                    </div>
                    <div class="alert alert-danger d-none" id="registerStatus" role="alert"></div>
                    <form id="registerForm">
                        <div class="row gx-2">
                            <div class="col-sm-6 mb-3">
                                <label class="small mb-1" for="firstName">First Name</label>
                                <input class="form-control" id="firstName" type="text" placeholder="Juan" />
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="small mb-1" for="lastName">Last Name</label>
                                <input class="form-control" id="lastName" type="text" placeholder="Dela Cruz" />
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="small mb-1" for="email">Email</label>
                            <input class="form-control" id="email" type="email" placeholder="name@example.com" />
                        </div>
                        <div class="mb-3">
                            <label class="small mb-1" for="mobile">Mobile Number</label>
                            <input class="form-control" id="mobile" type="text" placeholder="09XXXXXXXXX" />
                        </div>
                        <div class="row gx-2">
                            <div class="col-sm-6 mb-3">
                                <label class="small mb-1" for="password">Password</label>
                                <div class="input-group">
                                    <input class="form-control" id="password" type="password" />
                                    <button class="btn btn-outline-secondary" id="passwordToggle" type="button" aria-label="Show password" aria-controls="password">
                                        <i data-feather="eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="small mb-1" for="confirmPassword">Confirm Password</label>
                                <div class="input-group">
                                    <input class="form-control" id="confirmPassword" type="password" />
                                    <button class="btn btn-outline-secondary" id="confirmPasswordToggle" type="button" aria-label="Show password" aria-controls="confirmPassword">
                                        <i data-feather="eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="small text-muted mb-3">Password must be at least 12 characters and include uppercase, lowercase, number, and symbol.</div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" id="terms" type="checkbox" />
                            <label class="form-check-label small" for="terms">I confirm that my information is true and accurate.</label>
                        </div>
                        <button class="btn btn-dark w-100" id="registerSubmitBtn" type="submit">Create Applicant Account</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small mb-0">
                            Already registered?
                            <a class="text-decoration-none" href="login.html">Back to login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase-config.js"></script>
        <script src="js/supabase-register.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
