<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="LDSP reset password page" />
        <meta name="author" content="LGU Daet" />
        <title>LDSP | Reset Password</title>
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/ldss.css" rel="stylesheet" />
        <link rel="icon" type="image/png" href="img/icon.png" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.28.0/feather.min.js" crossorigin="anonymous"></script>
    </head>
    <body class="ldss-auth">
        <div class="ldss-auth-wrap">
            <div class="card ldss-auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img class="ldss-auth-logo mb-2" src="img/daet-lgu.png" alt="LGU Daet Logo" />
                        <h1 class="h4 ldss-auth-title">Set New Password</h1>
                        <p class="ldss-auth-subtitle mb-0">Enter your new password to complete account recovery.</p>
                    </div>
                    <div class="alert alert-danger d-none" id="resetStatus" role="alert"></div>
                    <form id="resetForm">
                        <div class="mb-3">
                            <label class="small mb-1" for="newPassword">New Password</label>
                            <input class="form-control" id="newPassword" type="password" />
                        </div>
                        <div class="mb-3">
                            <label class="small mb-1" for="confirmNewPassword">Confirm New Password</label>
                            <input class="form-control" id="confirmNewPassword" type="password" />
                        </div>
                        <div class="small text-muted mb-3">Use at least 12 characters with uppercase, lowercase, number, and symbol.</div>
                        <button class="btn btn-dark w-100" id="resetSubmitBtn" type="submit">Update Password</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small mb-0">
                            Back to
                            <a class="text-decoration-none" href="login.html">login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase-config.js"></script>
        <script src="js/supabase-reset-password.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
