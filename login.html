<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="LDSP shared login page" />
        <meta name="author" content="LGU Daet" />
        <title>LDSP | Login</title>
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/ldss.css" rel="stylesheet" />
        <link rel="icon" type="image/png" href="img/icon.png" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.28.0/feather.min.js" crossorigin="anonymous"></script>
    </head>
    <body class="ldss-auth">
        <div class="ldss-auth-wrap">
            <div class="card ldss-auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <img class="ldss-auth-logo mb-2" src="img/daet-lgu.png" alt="LGU Daet Logo" />
                        <h1 class="h4 ldss-auth-title">LDSP</h1>
                        <p class="ldss-auth-subtitle mb-0">LGU Daet Scholarship Portal</p>
                        <p class="small text-muted mt-2 mb-0">Note: This is the official LGU Daet Scholarship Portal.</p>
                    </div>
                    <div class="alert alert-danger d-none" id="loginStatus" role="alert"></div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="small mb-1" for="loginIdentifier">Email or Mobile Number</label>
                            <input class="form-control" id="loginIdentifier" type="text" placeholder="name@example.com or 09XXXXXXXXX" />
                        </div>
                        <div class="mb-3">
                            <label class="small mb-1" for="loginPassword">Password</label>
                            <div class="input-group">
                                <input class="form-control" id="loginPassword" type="password" placeholder="Enter password" />
                                <button class="btn btn-outline-secondary" id="loginPasswordToggle" type="button" aria-label="Show password" aria-controls="loginPassword">
                                    <i data-feather="eye"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check mb-0">
                                <input class="form-check-input" id="rememberMe" type="checkbox" />
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                            <a class="small text-decoration-none" href="forgot-password.html">Forgot password?</a>
                        </div>
                        <button class="btn btn-dark w-100" id="loginSubmitBtn" type="submit">Sign In</button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-2">Need an account to apply for scholarship?</p>
                        <a class="btn btn-outline-dark w-100" href="register.html">Register as Scholarship Applicant</a>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase-config.js"></script>
        <script src="js/supabase-login.js"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
